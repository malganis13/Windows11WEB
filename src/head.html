<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows 11 — Web Edition</title>
<style>
/* ================= THEME VARIABLES ================= */
:root{--accent:#0078d4;--accent-2:#4cc2ff;--tb-h:48px;--r:8px;
--font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:Consolas,"Cascadia Mono",Menlo,monospace}
[data-theme=dark]{--text:#fff;--text-2:rgba(255,255,255,.74);--text-3:rgba(255,255,255,.5);
--mica:rgba(32,32,32,.88);--mica-solid:#202020;--surface:rgba(255,255,255,.04);--surface-2:rgba(255,255,255,.075);--surface-solid:#2b2b2b;--card:rgba(255,255,255,.05);
--hover:rgba(255,255,255,.07);--press:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.15);
--acrylic:rgba(38,38,38,.74);--taskbar:rgba(28,28,28,.8);--input:rgba(255,255,255,.06);--input-b:rgba(255,255,255,.1);
--shadow:0 8px 32px rgba(0,0,0,.5);--wshadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.35);--accent-use:var(--accent-2);--on-accent:#000;--scroll:rgba(255,255,255,.22);--sel:rgba(255,255,255,.09)}
[data-theme=light]{--text:#1a1a1a;--text-2:rgba(0,0,0,.66);--text-3:rgba(0,0,0,.45);
--mica:rgba(243,243,243,.9);--mica-solid:#f3f3f3;--surface:rgba(255,255,255,.55);--surface-2:rgba(255,255,255,.85);--surface-solid:#fbfbfb;--card:rgba(255,255,255,.72);
--hover:rgba(0,0,0,.045);--press:rgba(0,0,0,.03);--border:rgba(0,0,0,.07);--border-2:rgba(0,0,0,.12);
--acrylic:rgba(242,242,242,.8);--taskbar:rgba(240,240,240,.84);--input:rgba(255,255,255,.8);--input-b:rgba(0,0,0,.12);
--shadow:0 8px 32px rgba(0,0,0,.18);--wshadow:0 18px 50px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.08);--accent-use:var(--accent);--on-accent:#fff;--scroll:rgba(0,0,0,.25);--sel:rgba(0,0,0,.06)}
.no-transparency{--mica:var(--mica-solid)!important;--acrylic:var(--mica-solid)!important;--taskbar:var(--mica-solid)!important}

/* ================= BASE ================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:var(--font);font-size:14px;color:var(--text);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
input,textarea,select{font:inherit;color:var(--text)}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:10px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
.acrylic{background:var(--acrylic);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--border-2);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:4px 14px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border-2);transition:background .12s}
.btn:hover{background:var(--hover)}.btn:active{opacity:.8}
.btn.primary{background:var(--accent-use);color:var(--on-accent);border-color:transparent}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:#c42b1c;color:#fff;border-color:transparent}
.inp{height:32px;padding:0 10px;border-radius:5px;background:var(--input);border:1px solid var(--input-b);border-bottom:2px solid var(--text-3);outline:none}
.inp:focus{border-bottom-color:var(--accent-use)}
.ico{width:16px;height:16px;flex:none}
.ico svg,.ic svg{width:100%;height:100%}
.muted{color:var(--text-2)}
.toggle{position:relative;width:40px;height:20px;border-radius:10px;border:1px solid var(--text-2);flex:none;transition:.15s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--text-2);transition:.15s}
.toggle.on{background:var(--accent-use);border-color:var(--accent-use)}.toggle.on::after{left:23px;background:var(--on-accent)}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--text-3);outline:none;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent-use);border:4px solid var(--mica-solid);box-shadow:0 0 0 1px var(--border-2)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent-use);border:4px solid var(--mica-solid)}

/* ================= DESKTOP ================= */
#wall{position:fixed;inset:0;background:#0b1a3a center/cover no-repeat;transition:background-image .4s}
#desktop{position:fixed;left:0;top:0;right:0;bottom:var(--tb-h)}
#icons{position:absolute;inset:0;padding:6px}
.dicon{position:absolute;width:84px;padding:6px 2px 4px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid transparent}
.dicon .ic{width:44px;height:44px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.dicon span{font-size:12px;color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.8);line-height:1.25;word-break:break-word;max-height:31px;overflow:hidden}
.dicon:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.12)}
.dicon.sel{background:rgba(120,180,255,.3);border-color:rgba(160,200,255,.45)}
.dicon.sel span{max-height:none}
#icons.small .dicon{width:72px}#icons.small .ic{width:32px;height:32px}
#icons.large .dicon{width:104px}#icons.large .ic{width:64px;height:64px}
#selbox{position:absolute;border:1px solid rgba(0,120,215,.9);background:rgba(0,120,215,.25);display:none;pointer-events:none;z-index:3}
#icons.refresh{animation:refl .25s}@keyframes refl{0%{opacity:0}100%{opacity:1}}

/* ================= WINDOWS ================= */
#wlayer{position:fixed;left:0;top:0;right:0;bottom:var(--tb-h);pointer-events:none;z-index:10}
.win{position:absolute;pointer-events:auto;display:flex;border-radius:8px;box-shadow:var(--wshadow);transition:opacity .18s ease,transform .2s cubic-bezier(.2,.9,.3,1),box-shadow .2s;animation:winIn .22s cubic-bezier(.1,.9,.2,1)}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.win.closing{opacity:0;transform:scale(.94);pointer-events:none}
.win.minimized{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .2s,transform .25s cubic-bezier(.4,0,.6,1),visibility 0s .25s}
.win.anim{transition:left .22s cubic-bezier(.2,.9,.3,1),top .22s cubic-bezier(.2,.9,.3,1),width .22s cubic-bezier(.2,.9,.3,1),height .22s cubic-bezier(.2,.9,.3,1),opacity .18s,transform .2s}
.win.max{border-radius:0;box-shadow:none}
.win.inactive{box-shadow:0 8px 24px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.2)}
.wclip{flex:1;display:flex;flex-direction:column;min-width:0;border-radius:inherit;overflow:hidden;background:var(--mica);backdrop-filter:blur(40px) saturate(170%);-webkit-backdrop-filter:blur(40px) saturate(170%);border:1px solid var(--border-2)}
.win.max .wclip{border:0}
.titlebar{height:32px;display:flex;align-items:center;flex:none;padding-left:12px;gap:10px}
.titlebar .ticon{width:16px;height:16px;flex:none}.titlebar .ticon svg{width:100%;height:100%}
.titlebar .ttitle{font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win.inactive .ttitle,.win.inactive .wctrls{opacity:.55}
.wctrls{display:flex;height:100%;align-self:flex-start}
.wc{width:46px;height:32px;display:flex;align-items:center;justify-content:center;transition:background .1s}
.wc svg{width:10px;height:10px;stroke-width:1.3}
.wc:hover{background:var(--hover)}
.wc.close:hover{background:#c42b1c;color:#fff}
.win:not(.max) .wc.close{border-top-right-radius:7px}
.wbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.rz{position:absolute;z-index:5}
.rz-n{top:-4px;left:6px;right:6px;height:8px;cursor:n-resize}.rz-s{bottom:-4px;left:6px;right:6px;height:8px;cursor:s-resize}
.rz-e{right:-4px;top:6px;bottom:6px;width:8px;cursor:e-resize}.rz-w{left:-4px;top:6px;bottom:6px;width:8px;cursor:w-resize}
.rz-ne{right:-5px;top:-5px;width:12px;height:12px;cursor:ne-resize}.rz-nw{left:-5px;top:-5px;width:12px;height:12px;cursor:nw-resize}
.rz-se{right:-5px;bottom:-5px;width:12px;height:12px;cursor:se-resize}.rz-sw{left:-5px;bottom:-5px;width:12px;height:12px;cursor:sw-resize}
.win.max .rz{display:none}
.snapmenu{position:fixed;z-index:9000;padding:10px;border-radius:8px;display:flex;gap:10px;animation:pop .14s ease-out}
.snapgrp{display:grid;gap:3px;width:84px;height:52px}
.snapgrp div{border-radius:4px;background:var(--surface-2);border:1px solid var(--border-2);transition:.1s}
.snapgrp div:hover{background:var(--accent-use);border-color:var(--accent-use)}
#snapPreview{position:fixed;z-index:9;border-radius:8px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(8px);pointer-events:none;display:none;transition:all .15s}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

/* ================= TASKBAR ================= */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:5000;background:var(--taskbar);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-top:1px solid var(--border-2);display:flex;align-items:center;transition:transform .3s}
#taskbar.gone{transform:translateY(100%)}
#tbCenter{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;height:100%}
.tbb{position:relative;width:40px;height:40px;border-radius:5px;display:flex;align-items:center;justify-content:center;transition:background .12s}
.tbb:hover{background:var(--hover)}.tbb:active .ic{transform:scale(.85)}
.tbb .ic{width:24px;height:24px;transition:transform .15s cubic-bezier(.3,1.6,.6,1)}
.tbb.launch .ic{animation:bounce .5s}@keyframes bounce{0%,100%{transform:none}35%{transform:translateY(-5px)}}
.tbb::after{content:"";position:absolute;bottom:2px;left:50%;width:0;height:3px;border-radius:2px;background:var(--text-3);transform:translateX(-50%);transition:width .2s,background .2s}
.tbb.running::after{width:6px}.tbb.active::after{width:16px;background:var(--accent-use)}
.tbb.active{background:var(--hover)}
#tbLeft{display:flex;align-items:center;padding-left:8px;height:100%}
#widgetBtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:5px}#widgetBtn:hover{background:var(--hover)}
#widgetBtn .ic{width:26px;height:26px}#widgetBtn small{display:block;font-size:12px;line-height:1.2}#widgetBtn small+small{color:var(--text-2)}
#tbRight{margin-left:auto;display:flex;align-items:center;height:100%;padding-right:6px;gap:2px}
.tray{display:flex;align-items:center;gap:8px;height:40px;padding:0 9px;border-radius:5px}.tray:hover,.tray.on{background:var(--hover)}
.tray .ico{width:16px;height:16px}
#clockBtn{flex-direction:column;align-items:flex-end;justify-content:center;gap:0;font-size:12px;line-height:1.3;position:relative;padding-right:30px}
#bellBadge{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:18px;height:18px}
#bellBadge b{position:absolute;right:-3px;top:-4px;min-width:14px;height:14px;border-radius:7px;background:var(--accent-use);color:var(--on-accent);font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 3px}
#showDesk{width:6px;height:100%;border-left:1px solid var(--border-2);margin-left:4px}#showDesk:hover{background:var(--hover)}
.tbpopup{position:fixed;z-index:6000;border-radius:8px;padding:6px;min-width:200px;animation:pop .14s}
.tbpopup .item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px}.tbpopup .item:hover{background:var(--hover)}
.tooltip{position:fixed;z-index:9999;padding:5px 9px;font-size:12px;border-radius:5px;pointer-events:none;animation:pop .1s}

/* ================= PANELS ================= */
.panel{position:fixed;z-index:5500;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .25s cubic-bezier(.1,.9,.2,1)}
.panel.open{opacity:1;pointer-events:auto;transform:none!important}
#start{left:50%;bottom:calc(var(--tb-h) + 12px);width:min(640px,calc(100vw - 16px));height:min(720px,calc(100vh - 72px));margin-left:calc(min(640px,calc(100vw - 16px)) / -2);transform:translateY(40px);display:flex;flex-direction:column;overflow:hidden}
#startSearch{margin:28px 32px 18px;position:relative}
#startSearch input{width:100%;height:36px;border-radius:18px;padding:0 16px 0 40px;background:var(--input);border:1px solid var(--input-b);border-bottom:2px solid var(--accent-use);outline:none}
#startSearch .ico{position:absolute;left:14px;top:10px}
.sm-scroll{flex:1;overflow:auto;padding:0 32px}
.sm-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;font-weight:600}
.sm-head button{font-size:12px;padding:3px 10px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border)}
.pinned{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:22px}
.papp{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:5px;font-size:12px;text-align:center}
.papp:hover{background:var(--hover)}
.papp .ic{width:32px;height:32px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:16px}
.rec{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:5px;min-width:0}.rec:hover{background:var(--hover)}
.rec .ic{width:30px;height:30px;flex:none}.rec div{min-width:0}.rec b{display:block;font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rec small{color:var(--text-2);font-size:12px}
.sm-foot{height:64px;flex:none;border-top:1px solid var(--border-2);background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 48px}
.user{display:flex;align-items:center;gap:12px;padding:6px 12px;border-radius:5px}.user:hover{background:var(--hover)}
.avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none}
.powerbtn{width:40px;height:40px;border-radius:5px;display:flex;align-items:center;justify-content:center}.powerbtn:hover{background:var(--hover)}
.sm-results .rec{grid-column:span 2}
#widgets{left:12px;top:12px;bottom:calc(var(--tb-h) + 12px);width:min(760px,calc(100vw - 24px));transform:translateX(-40px);overflow:auto;padding:22px}
.wg-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.wg-time{font-size:22px;font-weight:600}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wcard{border-radius:10px;background:var(--card);border:1px solid var(--border);padding:16px;min-height:150px}
.wcard h4{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.weather{background:linear-gradient(160deg,#3a7bd5,#00d2ff);color:#fff;border:0}
.weather .big{font-size:46px;font-weight:300;line-height:1}
.wforecast{display:flex;justify-content:space-between;margin-top:14px;font-size:12px;text-align:center}
.wforecast .ic{width:24px;height:24px;margin:4px auto}
.wclock{display:flex;align-items:center;justify-content:center}
.wcard textarea{width:100%;height:110px;resize:none;background:transparent;border:0;outline:none;font-size:13px;line-height:1.5}
.meter{margin:8px 0}.meter div{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.meter i{display:block;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}.meter i b{display:block;height:100%;background:var(--accent-use);transition:width .6s}
.news{grid-column:span 2;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.news .wcard{min-height:120px;padding:0;overflow:hidden}
.news .thumb{height:70px}
.news p{padding:10px 12px;font-size:12.5px;line-height:1.4}
#copilot{right:12px;top:12px;bottom:calc(var(--tb-h) + 12px);width:min(420px,calc(100vw - 24px));transform:translateX(40px);display:flex;flex-direction:column;overflow:hidden}
.cp-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.cp-head .ic{width:28px;height:28px}
.cp-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:14px;line-height:1.45;font-size:13.5px;animation:pop .2s;white-space:pre-wrap;user-select:text}
.msg.bot{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--accent-use);color:var(--on-accent);border-bottom-right-radius:4px;align-self:flex-end}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--text-2);margin:0 2px;animation:tdot 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.cp-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.chip{padding:5px 11px;border-radius:14px;border:1px solid var(--border-2);font-size:12px;background:var(--surface)}.chip:hover{background:var(--hover)}
.cp-input{display:flex;gap:8px;padding:12px 16px 16px}
.cp-input input{flex:1;height:40px;border-radius:20px;padding:0 16px;background:var(--input);border:1px solid var(--input-b);outline:none}
.cp-input button{width:40px;height:40px;border-radius:50%;background:var(--accent-use);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
#quick{right:12px;bottom:calc(var(--tb-h) + 12px);width:min(360px,calc(100vw - 24px));transform:translateY(40px);overflow:hidden}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:22px 22px 10px}
.qt{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.qt button{width:100%;height:48px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;transition:.15s}
.qt button .ico{width:18px;height:18px}
.qt.on button{background:var(--accent-use);color:var(--on-accent);border-color:transparent}
.qslider{display:flex;align-items:center;gap:14px;padding:12px 26px}
.qslider .ico{width:18px;height:18px}
.qslider span{width:28px;text-align:right;font-size:12px}
.qfoot{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;margin-top:10px;border-top:1px solid var(--border);background:var(--surface);font-size:12px}
#notif{right:12px;bottom:calc(var(--tb-h) + 12px);width:min(360px,calc(100vw - 24px));transform:translateY(40px);background:none!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 72px)}
#notif>div{border-radius:10px}
.nc{flex:1;min-height:120px;display:flex;flex-direction:column;overflow:hidden}
.nc-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.nc-list{overflow:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px}
.ncard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;position:relative;animation:pop .2s}
.ncard .h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);margin-bottom:6px}.ncard .h .ic{width:16px;height:16px}
.ncard b{display:block;font-size:13.5px;margin-bottom:2px}.ncard p{font-size:13px;color:var(--text-2)}
.ncard .x{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:4px;display:none;align-items:center;justify-content:center}.ncard:hover .x{display:flex}.ncard .x:hover{background:var(--hover)}.ncard .x svg{width:10px}
.cal{padding:14px 16px 16px;flex:none}
.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
.cal-top div{display:flex}.cal-top button{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center}.cal-top button:hover{background:var(--hover)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}
.cal-grid span{height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px}
.cal-grid span.dn{color:var(--text-2);font-size:12px;height:30px}
.cal-grid span.o{color:var(--text-3)}.cal-grid span.d:hover{background:var(--hover)}
.cal-grid span.t{background:var(--accent-use);color:var(--on-accent);font-weight:600}
#toasts{position:fixed;right:12px;bottom:calc(var(--tb-h) + 12px);z-index:7000;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 24px));pointer-events:none}
.toast{pointer-events:auto;border-radius:8px;padding:14px;animation:toastIn .35s cubic-bezier(.1,.9,.2,1);transition:.3s}
.toast.out{opacity:0;transform:translateX(110%)}
@keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:none}}

/* ================= MENUS ================= */
.ctx{position:fixed;z-index:9500;min-width:220px;border-radius:8px;padding:4px;animation:pop .12s ease-out}
.ctx .mi{display:flex;align-items:center;gap:12px;height:32px;padding:0 12px;border-radius:4px;position:relative;white-space:nowrap}
.ctx .mi:hover,.ctx .mi.hl{background:var(--hover)}
.ctx .mi .ico{width:16px;height:16px;opacity:.9}
.ctx .mi .k{margin-left:auto;padding-left:24px;color:var(--text-3);font-size:12px}
.ctx .mi .arr{margin-left:auto;width:12px;height:12px}
.ctx .mi.dis{opacity:.4;pointer-events:none}
.ctx hr{border:0;border-top:1px solid var(--border-2);margin:4px 0}
.ctx .chk{width:16px;height:16px;display:flex;align-items:center;justify-content:center}

/* ================= OVERLAYS ================= */
#dim{position:fixed;inset:0;background:#000;pointer-events:none;z-index:99990;opacity:0;transition:opacity .2s}
#night{position:fixed;inset:0;background:#ff9a2e;mix-blend-mode:multiply;pointer-events:none;z-index:99989;opacity:0;transition:opacity .4s}
#alttab{position:fixed;inset:0;z-index:9800;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
#alttab .box{border-radius:12px;padding:18px;display:flex;gap:14px;flex-wrap:wrap;max-width:90vw;justify-content:center}
.atw{width:170px;border-radius:8px;padding:8px;border:2px solid transparent;display:flex;flex-direction:column;gap:8px}
.atw.sel{border-color:var(--accent-use);background:var(--hover)}
.atw .t{display:flex;gap:8px;align-items:center;font-size:12px;white-space:nowrap;overflow:hidden}.atw .t .ic{width:16px;height:16px;flex:none}
.atw .p{height:100px;border-radius:5px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}.atw .p .ic{width:44px;height:44px}
#bsod{position:fixed;inset:0;z-index:999999;background:#0078d7;color:#fff;display:none;padding:9vh 11vw;font-family:var(--font);cursor:none}
#bsod .face{font-size:min(140px,18vw);font-weight:300;line-height:1;margin-bottom:5vh}
#bsod h1{font-size:min(26px,4.5vw);font-weight:300;line-height:1.45;max-width:860px;margin-bottom:4vh}
#bsod .pct{font-size:min(26px,4.5vw);font-weight:300;margin-bottom:5vh}
#bsod .row{display:flex;gap:22px;align-items:flex-start;font-size:14px;line-height:1.6;font-weight:300}
#bsod .qr{width:110px;height:110px;background:#fff;padding:6px;flex:none}
#boot,#lock,#off{position:fixed;inset:0;z-index:99995;display:none}
#boot{background:#000;align-items:center;justify-content:center;flex-direction:column;gap:90px}
#boot .logo{width:110px;height:110px}
.spinner{width:40px;height:40px;position:relative}
.spinner i{position:absolute;inset:0;animation:spin 2.6s infinite cubic-bezier(.5,.15,.5,.85)}
.spinner i::before{content:"";position:absolute;left:50%;top:0;width:5px;height:5px;border-radius:50%;background:#fff;margin-left:-2.5px}
.spinner i:nth-child(2){animation-delay:.13s}.spinner i:nth-child(3){animation-delay:.26s}.spinner i:nth-child(4){animation-delay:.39s}.spinner i:nth-child(5){animation-delay:.52s}
@keyframes spin{0%{transform:rotate(0);opacity:1}75%{transform:rotate(720deg);opacity:1}76%,100%{transform:rotate(720deg);opacity:0}}
#lock{background:#0b1a3a center/cover;color:#fff;overflow:hidden}
#lock .lbg{position:absolute;inset:-30px;background:inherit;background-size:cover;transition:filter .5s}
#lock.login .lbg{filter:blur(26px) brightness(.75)}
#lock .ltime{position:absolute;top:12vh;width:100%;text-align:center;transition:.45s;text-shadow:0 2px 16px rgba(0,0,0,.3)}
#lock .ltime b{display:block;font-size:min(110px,22vw);font-weight:600;line-height:1}
#lock .ltime span{font-size:min(22px,5vw)}
#lock.login .ltime{opacity:0;transform:translateY(-60px)}
#lock .lhint{position:absolute;bottom:8vh;width:100%;text-align:center;font-size:14px;opacity:.85}
#lock.login .lhint{opacity:0}
#lock .lform{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:.4s;transform:translateY(30px)}
#lock.login .lform{opacity:1;pointer-events:auto;transform:none}
#lock .lform .avatar{width:180px;height:180px}
#lock .lform h2{font-weight:400;font-size:28px}
#off{background:#000;color:#fff;align-items:center;justify-content:center;flex-direction:column;gap:20px;font-size:18px;font-weight:300}

/* ================= COMMON APP UI ================= */
.toolbar{display:flex;align-items:center;gap:4px;padding:6px 10px;flex:none;border-bottom:1px solid var(--border)}
.tbtn{height:32px;min-width:32px;padding:0 8px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;transition:background .1s}
.tbtn:hover{background:var(--hover)}.tbtn.on{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-2)}
.tbtn:disabled{opacity:.35;pointer-events:none}
.tbtn .ico{width:16px;height:16px}
.vsep{width:1px;height:20px;background:var(--border-2);margin:0 4px}
.statusbar{height:26px;flex:none;display:flex;align-items:center;gap:18px;padding:0 12px;font-size:12px;color:var(--text-2);border-top:1px solid var(--border)}
.dlg{padding:20px 24px;display:flex;flex-direction:column;gap:14px;flex:1}
.dlg p{line-height:1.5}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:16px 24px;background:var(--surface);border-top:1px solid var(--border)}
.dlg-foot .btn{min-width:110px}
.sel-text{user-select:text;-webkit-user-select:text}

/* explorer */
.ex{display:flex;flex:1;min-height:0}
.ex-side{width:200px;flex:none;overflow:auto;padding:8px 6px;border-right:1px solid var(--border)}
.ex-side .si{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:5px;font-size:13px;white-space:nowrap}
.ex-side .si:hover{background:var(--hover)}.ex-side .si.on{background:var(--sel)}
.ex-side .si .ic{width:18px;height:18px;flex:none}
.ex-side hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
.ex-main{flex:1;overflow:auto;padding:10px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px}
.fi{width:96px;padding:8px 4px;border-radius:5px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid transparent;font-size:12px;text-align:center;word-break:break-word}
.fi .ic{width:48px;height:48px}
.fi:hover{background:var(--hover)}.fi.sel{background:var(--sel);border-color:var(--border-2)}
.drive{width:260px;flex-direction:row;text-align:left;gap:12px;padding:10px}
.drive .bar{height:6px;border-radius:3px;background:var(--surface-2);margin:6px 0 4px;overflow:hidden}.drive .bar b{display:block;height:100%;width:42%;background:var(--accent-use)}
.addr{flex:1;display:flex;align-items:center;height:32px;border-radius:5px;background:var(--input);border:1px solid var(--input-b);padding:0 6px;min-width:0}
.addr input{flex:1;background:transparent;border:0;outline:none;height:100%;padding:0 6px;min-width:0}
.crumbs{display:flex;align-items:center;flex:1;overflow:hidden;white-space:nowrap}
.crumbs span{padding:2px 6px;border-radius:4px;font-size:13px}.crumbs span:hover{background:var(--hover)}.crumbs i{opacity:.5;font-style:normal;font-size:11px;padding:0 2px}
.ex-empty{width:100%;text-align:center;color:var(--text-2);padding:60px 0}
/* terminal */
.term{flex:1;background:#0c0c0c;color:#cccccc;font-family:var(--mono);font-size:14px;line-height:1.35;padding:10px 12px;overflow:auto;user-select:text;-webkit-user-select:text;position:relative;cursor:text}
.term-tabs{display:flex;align-items:flex-end;height:36px;background:#1f1f1f;padding-left:8px;flex:none}
.term-tab{height:30px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#0c0c0c;color:#eee;border-radius:7px 7px 0 0;font-size:12px}.term-tab .ic{width:16px;height:16px}
.term pre{white-space:pre-wrap;word-break:break-word;font:inherit}
.term .line{display:flex}.term .line input{flex:1;background:transparent;border:0;outline:none;color:inherit;font:inherit;caret-color:#fff;padding:0;margin-left:6px}
.term canvas{position:absolute;inset:0;width:100%;height:100%}
/* notepad */
.np-tabs{display:flex;align-items:flex-end;gap:2px;padding:0 6px;height:38px;flex:none}
.np-tab{height:32px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-radius:7px 7px 0 0;font-size:12px;max-width:200px;min-width:110px;position:relative}
.np-tab:hover{background:var(--hover)}.np-tab.on{background:var(--surface-solid)}
.np-tab span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.np-tab .dot{width:7px;height:7px;border-radius:50%;background:var(--text-2);display:none}.np-tab.dirty .dot{display:block}
.np-tab button{width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center}.np-tab button:hover{background:var(--hover)}.np-tab button svg{width:9px}
.np-menu{display:flex;gap:2px;padding:4px 6px;background:var(--surface-solid);flex:none;border-bottom:1px solid var(--border)}
.np-menu .tbtn{font-size:13px;height:28px}
.np-edit{flex:1;display:flex;min-height:0;background:var(--surface-solid)}
.np-gutter{width:48px;flex:none;padding:10px 8px 10px 0;text-align:right;color:var(--text-3);font-family:var(--mono);font-size:14px;line-height:21px;overflow:hidden;white-space:pre;border-right:1px solid var(--border)}
.np-edit textarea{flex:1;resize:none;border:0;outline:none;background:transparent;padding:10px 12px;font-family:var(--mono);font-size:14px;line-height:21px;white-space:pre;overflow:auto;user-select:text;tab-size:4}
/* paint */
.pt-ribbon{display:flex;align-items:center;gap:6px;padding:8px 10px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.pt-grp{display:flex;align-items:center;gap:2px;padding:0 8px;border-right:1px solid var(--border-2)}
.pt-colors{display:grid;grid-template-columns:repeat(10,18px);gap:4px}
.pt-colors i{width:18px;height:18px;border-radius:50%;border:1px solid var(--border-2);display:block}
.pt-colors i.on{outline:2px solid var(--accent-use);outline-offset:1px}
.pt-cur{width:30px;height:30px;border-radius:50%;border:2px solid var(--border-2)}
.pt-area{flex:1;overflow:auto;background:var(--surface);display:flex;padding:20px}
.pt-stage{position:relative;margin:auto;box-shadow:0 2px 12px rgba(0,0,0,.25);flex:none}
.pt-stage canvas{position:absolute;left:0;top:0;cursor:crosshair}
.pt-stage canvas:first-child{position:relative;background:#fff}
/* mines */
.ms{flex:1;display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px;overflow:auto}
.ms-bar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:100%;gap:10px}
.ms-cnt{min-width:76px;padding:6px 10px;border-radius:6px;background:var(--card);border:1px solid var(--border);font-family:var(--mono);font-size:18px;display:flex;align-items:center;gap:8px;justify-content:center}
.ms-cnt .ico{width:16px;height:16px}
.ms-face{width:44px;height:44px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center}.ms-face:hover{background:var(--hover)}.ms-face svg{width:30px;height:30px}
.ms-grid{display:grid;gap:2px;padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--border)}
.ms-c{width:26px;height:26px;border-radius:4px;background:linear-gradient(180deg,#6aa9f0,#3c7fd8);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;transition:background .1s,transform .08s}
.ms-c:hover{filter:brightness(1.15)}.ms-c:active{transform:scale(.92)}
.ms-c.op{background:var(--surface-2);filter:none;transform:none}
.ms-c.boom{background:#e8412c!important}
.ms-c svg{width:18px;height:18px}
.ms-c.n1{color:#4ea4ff}.ms-c.n2{color:#4caf50}.ms-c.n3{color:#ff5252}.ms-c.n4{color:#9575ff}.ms-c.n5{color:#ff8f00}.ms-c.n6{color:#00bcd4}.ms-c.n7{color:var(--text)}.ms-c.n8{color:var(--text-3)}
.ms-msg{font-size:14px;min-height:20px}
/* solitaire */
.sol{flex:1;position:relative;background:radial-gradient(ellipse at 50% 30%,#1f8a4c,#0d5530 80%);overflow:hidden}
.sol-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(0,0,0,.25);color:#fff;font-size:13px}
.sol-bar .tbtn:hover{background:rgba(255,255,255,.12)}
.sol-bar b{font-weight:600}
.card{position:absolute;width:80px;height:112px;border-radius:7px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);color:#1a1a1a;font-family:Georgia,"Times New Roman",serif;transition:left .18s,top .18s;will-change:left,top}
.card.red{color:#d32f2f}
.card .cr{position:absolute;left:6px;top:4px;font-size:16px;font-weight:700;line-height:1;text-align:center}
.card .cr small{display:block;font-size:14px}
.card .cb{position:absolute;right:6px;bottom:4px;transform:rotate(180deg);font-size:16px;font-weight:700;line-height:1;text-align:center}.card .cb small{display:block;font-size:14px}
.card .cm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px}
.card.back{background:repeating-linear-gradient(45deg,#1d5fbf 0 6px,#2a72d9 6px 12px);border:4px solid #fff}
.card.back>*{display:none}
.card.drag{transition:none;box-shadow:0 10px 24px rgba(0,0,0,.45);z-index:9999!important}
.card.hint{box-shadow:0 0 0 3px #ffd54f}
.slot{position:absolute;width:80px;height:112px;border-radius:7px;border:2px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);font-size:34px}
.sol canvas{position:absolute;inset:0;z-index:10000}
.sol-win{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:10001;padding:22px 30px;border-radius:12px;text-align:center;color:var(--text)}
/* taskmgr */
.tm{display:flex;flex:1;min-height:0}
.tm-side{width:56px;flex:none;padding:6px;display:flex;flex-direction:column;gap:4px;transition:width .2s}
.tm-side.wide{width:200px}
.tm-side .si{display:flex;align-items:center;gap:14px;height:40px;padding:0 12px;border-radius:5px;white-space:nowrap;overflow:hidden;position:relative;font-size:13px}
.tm-side .si .ico{width:18px;height:18px}
.tm-side .si:hover{background:var(--hover)}.tm-side .si.on{background:var(--sel)}
.tm-side .si.on::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--accent-use)}
.tm-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface-solid);border-top-left-radius:8px;border-left:1px solid var(--border);border-top:1px solid var(--border)}
.tm-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;font-size:18px;font-weight:600}
.tm-table{flex:1;overflow:auto}
.tm-table table{width:100%;border-collapse:collapse;font-size:12.5px}
.tm-table th{position:sticky;top:0;background:var(--surface-solid);text-align:left;font-weight:400;color:var(--text-2);padding:6px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tm-table td{padding:6px 12px;white-space:nowrap}
.tm-table td.num,.tm-table th.num{text-align:right}
.tm-table tr.r:hover td{background:var(--hover)}.tm-table tr.r.sel td{background:var(--sel)}
.tm-table td .nm{display:flex;align-items:center;gap:10px}.tm-table td .ic{width:16px;height:16px}
.tm-perf{flex:1;display:flex;min-height:0}
.tm-plist{width:220px;flex:none;overflow:auto;padding:6px;border-right:1px solid var(--border)}
.tm-pi{display:flex;gap:10px;padding:8px;border-radius:5px;align-items:center}.tm-pi:hover{background:var(--hover)}.tm-pi.on{background:var(--sel)}
.tm-pi canvas{width:70px;height:44px;border:1px solid var(--border-2);flex:none}
.tm-pi b{display:block;font-weight:600;font-size:13px}.tm-pi small{font-size:12px;color:var(--text-2)}
.tm-pview{flex:1;padding:16px 20px;display:flex;flex-direction:column;min-width:0;overflow:auto}
.tm-pview h2{font-size:24px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.tm-pview h2 small{font-size:13px;font-weight:400;color:var(--text-2)}
.tm-pview canvas{width:100%;flex:1;min-height:180px;margin:10px 0;border:1px solid var(--border-2)}
.tm-stats{display:grid;grid-template-columns:repeat(4,auto);gap:6px 28px;justify-content:start;font-size:12px}
.tm-stats b{display:block;font-size:18px;font-weight:400}
/* calc */
.calc{display:flex;flex:1;min-height:0}
.calc-main{flex:1;display:flex;flex-direction:column;padding:4px 6px 6px;min-width:0}
.calc-top{display:flex;align-items:center;gap:8px;padding:2px 4px;font-size:18px;font-weight:600}
.calc-disp{padding:6px 10px;text-align:right;flex:none}
.calc-disp .ex{font-size:13px;color:var(--text-2);height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block}
.calc-disp .rs{font-size:44px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:text}
.calc-keys{flex:1;display:grid;gap:2px}
.ck{border-radius:5px;background:var(--surface-2);border:1px solid var(--border);font-size:15px;transition:background .08s;min-height:30px}
.ck:hover{background:var(--hover)}.ck:active{opacity:.7}
.ck.num{background:var(--card);font-weight:600;font-size:17px}
.ck.eq{background:var(--accent-use);color:var(--on-accent);border-color:transparent}
.calc-hist{width:240px;flex:none;border-left:1px solid var(--border);display:flex;flex-direction:column;padding:10px}
.calc-hist .list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.calc-hist .he{text-align:right;padding:8px;border-radius:5px}.calc-hist .he:hover{background:var(--hover)}
.calc-hist .he small{display:block;color:var(--text-2);font-size:12px}.calc-hist .he b{font-size:18px;font-weight:600}
/* settings */
.st{display:flex;flex:1;min-height:0}
.st-side{width:270px;flex:none;padding:8px 12px;overflow:auto}
.st-user{display:flex;gap:12px;align-items:center;padding:10px 8px 18px}
.st-user .avatar{width:60px;height:60px}
.st-side .si{display:flex;align-items:center;gap:14px;height:38px;padding:0 14px;border-radius:5px;position:relative;font-size:13.5px}
.st-side .si:hover{background:var(--hover)}.st-side .si.on{background:var(--sel)}
.st-side .si.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent-use)}
.st-side .si .ico{width:18px;height:18px}
.st-main{flex:1;overflow:auto;padding:14px 32px 32px}
.st-main h1{font-size:28px;font-weight:600;margin:6px 0 18px}
.st-main h3{font-size:14px;font-weight:600;margin:20px 0 8px}
.srow{display:flex;align-items:center;gap:16px;min-height:66px;padding:12px 18px;border-radius:6px;background:var(--card);border:1px solid var(--border);margin-bottom:4px}
.srow .ico{width:20px;height:20px}
.srow .tx{flex:1}.srow .tx small{display:block;color:var(--text-2);font-size:12px;margin-top:2px}
.srow input[type=range]{width:200px}
.wallgrid{display:flex;gap:12px;flex-wrap:wrap}
.wallthumb{width:120px;height:76px;border-radius:6px;background-size:cover;background-position:center;border:2px solid transparent;position:relative}
.wallthumb.on{border-color:var(--accent-use);box-shadow:0 0 0 2px var(--accent-use)}
.wallthumb span{position:absolute;left:0;right:0;bottom:-20px;font-size:11px;text-align:center;color:var(--text-2)}
.st-prev{width:300px;height:180px;border-radius:10px;background-size:cover;background-position:center;border:6px solid #1a1a1a;margin-bottom:16px;position:relative;overflow:hidden}
.st-prev::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:rgba(30,30,30,.7)}
.accents{display:grid;grid-template-columns:repeat(8,40px);gap:8px}
.accents i{width:40px;height:40px;border-radius:5px;display:block;border:2px solid transparent}
.accents i.on{border-color:var(--text);box-shadow:inset 0 0 0 2px var(--mica-solid)}
/* image viewer */
.iv{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--surface)}
.iv canvas{max-width:100%;max-height:100%;box-shadow:0 4px 20px rgba(0,0,0,.3)}
@media (max-width:640px){.pinned{grid-template-columns:repeat(4,1fr)}.wgrid{grid-template-columns:1fr}.news{grid-column:auto;grid-template-columns:1fr}.recs{grid-template-columns:1fr}.st-side{width:64px}.st-side .si span,.st-user div{display:none}.ex-side{width:56px}.ex-side .si span{display:none}#widgetBtn small{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.ck.pressed{filter:brightness(1.25);transform:scale(.97)}
.st-prev{position:relative}
.st-prev-win{position:absolute;left:18%;top:18%;width:46%;height:46%;border-radius:6px;background:var(--win-bg,rgba(40,40,40,.85));border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.st-prev-win::before{content:'';display:block;height:14%;background:var(--accent);opacity:.8;border-radius:6px 6px 0 0}
.st-prev-tb{position:absolute;left:0;right:0;bottom:0;height:10%;background:var(--taskbar-bg,rgba(30,30,30,.8));backdrop-filter:blur(10px)}
.acc-custom{width:32px;height:32px;border-radius:6px;display:inline-block;border:2px solid transparent}
body.noexplorer #startMenu,body.noexplorer .panel{display:none!important}
</style>
